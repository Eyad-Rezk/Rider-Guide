kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rider-guide-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.33.0
    extraPortMappings:
      - containerPort: 3000
        hostPort: 3000
        protocol: TCP
      - containerPort: 80
        hostPort: 80
        protocol: TCP

  - role: worker
    image: kindest/node:v1.33.0
  - role: worker
    image: kindest/node:v1.33.0