apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
  namespace: rider-guide
  labels:
    app: frontend

spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-cont
        image: eyadrezk/bike-frontend:latest
        ports:
        - containerPort: 80
