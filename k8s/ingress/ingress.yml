#____________________Ingress_____________________
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rider-guide-ingress
  namespace: rider-guide
spec:
  ingressClassName: nginx
  rules:
  - host: rider-guide.com
    http:
      paths:
      - path: /bikes
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80     # service port
